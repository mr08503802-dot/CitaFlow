# ========================================================
# Render Blueprint Specification for CitaFlow (Micro-SaaS)
# Docs: https://render.com/docs/blueprint-spec
# ========================================================

databases:
  - name: citaflow-postgres
    databaseName: citaflow
    user: citaflow
    plan: free # or starter
    postgresMajorVersion: 16
    region: oregon # or frankfurt / ohio / singapore

services:
  - type: web
    name: citaflow
    runtime: node
    plan: free # or starter
    region: oregon # match database region for lowest latency
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: citaflow-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_STARTUP
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: META_WA_VERIFY_TOKEN
        generateValue: true
