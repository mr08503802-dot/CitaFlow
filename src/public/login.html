<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | CitaFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-8 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600 flex items-center justify-center font-black text-2xl text-white mx-auto shadow-lg shadow-indigo-600/30">
        C
      </div>
      <h1 class="text-2xl font-extrabold text-white">Acceso al Panel</h1>
      <p class="text-xs text-zinc-400">Ingresa a tu cuenta de CitaFlow para gestionar tu agenda</p>
    </div>

    <!-- Alert -->
    <div id="login-alert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs text-center"></div>

    <!-- Quick 1-click Demo Fill Button -->
    <div class="p-3 rounded-2xl bg-indigo-950/40 border border-indigo-500/20 text-center">
      <div class="text-[11px] text-zinc-400 mb-1.5 font-medium">¿Deseas probar la demo preconfigurada?</div>
      <button type="button" onclick="fillDemoCredentials()" class="w-full py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-bold transition">
        ⚡ Cargar Credenciales Demo (Barbería Imperio)
      </button>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
      <div>
        <label class="block text-zinc-300 font-semibold mb-1">Correo Electrónico *</label>
        <input type="email" id="login-email" required placeholder="admin@tuempresa.com" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500" />
      </div>

      <div>
        <label class="block text-zinc-300 font-semibold mb-1">Contraseña *</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500" />
      </div>

      <button type="submit" id="btn-login" class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
        <span>Iniciar Sesión</span>
      </button>
    </form>

    <div class="pt-2 text-center text-xs text-zinc-400 border-t border-zinc-800">
      ¿No tienes una cuenta aún? <a href="/register" class="text-indigo-400 hover:underline font-semibold">Registra tu Negocio aquí</a>
    </div>

  </div>

  <script>
    function fillDemoCredentials() {
      document.getElementById('login-email').value = 'admin@barberiaimperio.com';
      document.getElementById('login-password').value = 'Password123!';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const alert = document.getElementById('login-alert');
      alert.classList.add('hidden');

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Verificando...`;

      const payload = {
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value,
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        btn.disabled = false;
        btn.innerHTML = 'Iniciar Sesión';

        if (!data.success) {
          alert.textContent = data.message || 'Error de credenciales.';
          alert.classList.remove('hidden');
          return;
        }

        localStorage.setItem('citaflow_token', data.data.token);
        window.location.href = '/admin';
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = 'Iniciar Sesión';
        alert.textContent = 'Error de conexión con el servidor.';
        alert.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
